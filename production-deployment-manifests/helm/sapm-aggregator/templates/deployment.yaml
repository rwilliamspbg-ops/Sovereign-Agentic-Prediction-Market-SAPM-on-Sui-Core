---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}
  namespace: {{ .Values.deployment.namespaceOverride | default .Release.Namespace }}
  labels:
    app: sapm-aggregator
    version: {{ .Values.global.imageTag | quote }}
spec:
  replicas: {{ .Values.replicaCount | default 3 }}
  selector:
    matchLabels:
      app: sapm-aggregator
  template:
    metadata:
      labels:
        app: sapm-aggregator
        version: {{ .Values.global.imageTag | quote }}
{{- with .Values.deployment.labels }}
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: aggregator
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.aggregator.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.aggregator.image.pullPolicy }}
          command:
            - /usr/local/bin/aggregator
          args:
            - "--network-interface={{ .Values.aggregator.xdp.networkInterface | default "eth0,eth1" }}"
            - "--ring-buffer-size={{ .Values.aggregator.xdp.ringBufferSize | default 262144 }}"
{{- if .Values.aggregator.cpuAffinity }}
            - "--cpu-affinity={{ .Values.aggregator.cpuAffinity }}"
{{- end }}
{{- if .Values.aggregator.hugepages.enabled }}
            - "--hugepages-dir={{ .Values.aggregator.hugepages.mountPath | default "/dev/hugepages" }}"
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8080 }}
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 9090 }}
          resources:
            limits:
              cpu: {{ .Values.aggregator.resources.limits.cpu }}
              memory: {{ .Values.aggregator.resources.limits.memory }}
            requests:
              cpu: {{ .Values.aggregator.resources.requests.cpu }}
              memory: {{ .Values.aggregator.resources.requests.memory }}
          securityContext:
            privileged: {{ .Values.securityContext.privileged }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              add:
{{- range .Values.securityContext.capabilities.add }}
                - {{ . }}
{{- end }}
{{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - {{ .Values.livenessProbe.execCommand | quote }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
{{- end }}
{{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - {{ .Values.readinessProbe.execCommand | quote }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
{{- end }}
          volumeMounts:
{{- if .Values.aggregator.hugepages.enabled }}
            - name: hugepages-2mi
              mountPath: {{ .Values.aggregator.hugepages.mountPath | default "/dev/hugepages" }}
{{- end }}
            - name: xdp-config
              mountPath: /etc/sapm/xdp
              readOnly: true
      topologySpreadConstraints:
{{- if .Values.deployment.topologySpreadConstraints }}
{{ toYaml (list .Values.deployment.topologySpreadConstraints) | indent 8 }}
{{- else }}
        []
{{- end }}
      volumes:
{{- if .Values.aggregator.hugepages.enabled }}
        - name: hugepages-2mi
          hostPath:
            path: {{ .Values.aggregator.hugepages.mountPath | default "/dev/hugepages" }}
            type: DirectoryOrCreate
{{- end }}
        - name: xdp-config
          configMap:
            name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-xdp-config
            defaultMode: 0644

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}
  namespace: {{ .Values.deployment.namespaceOverride | default .Release.Namespace }}
  labels:
    app: sapm-aggregator
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: sapm-aggregator
  ports:
    - name: http
      port: {{ .Values.service.port | default 8080 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
    - name: metrics
      port: {{ .Values.metrics.port | default 9090 }}
      targetPort: {{ .Values.metrics.port | default 9090 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-xdp-config
  namespace: {{ .Values.deployment.namespaceOverride | default .Release.Namespace }}
data:
{{- if .Values.aggregator.xdp.enabled }}
  xdp-program.conf: |
    interface={{ .Values.aggregator.xdp.networkInterface | default "eth0,eth1" }}
    ring-buffer-size={{ .Values.aggregator.xdp.ringBufferSize | default 262144 }}
    packet-max-size={{ .Values.aggregator.xdp.packetMaxSize | default 9516 }}
    xdp-action=pass
{{- end }}
  sysctl-optimizations.conf: |
    vm.nr_hugepages={{ .Values.sysctlOptimizations.vmNrHugepages | default 32768 }}
    vm.max_map_count={{ .Values.sysctlOptimizations.vmMaxMapCount | default 262144 }}
    net.core.rmem_max={{ .Values.sysctlOptimizations.netCoreRmemMax | default 67108864 }}
    net.core.wmem_max={{ .Values.sysctlOptimizations.netCoreWmemMax | default 67108864 }}
    net.ipv4.tcp_rmem={{ .Values.sysctlOptimizations.netIpv4TcpRmem | default "4096 87380 67108864" }}
    net.ipv4.tcp_wmem={{ .Values.sysctlOptimizations.netIpv4TcpWmem | default "4096 65536 67108864" }}
    net.core.bpf_jit_enable={{ .Values.sysctlOptimizations.netCoreBpfJitEnable | default 1 }}

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-quota
  namespace: {{ .Values.deployment.namespaceOverride | default .Release.Namespace }}
spec:
  hard:
    requests.cpu: {{ .Values.resourceQuota.requestsCpu | default "32" }}
    requests.memory: {{ .Values.resourceQuota.requestsMemory | default "64Gi" }}
    limits.cpu: {{ .Values.resourceQuota.limitsCpu | default "64" }}
    limits.memory: {{ .Values.resourceQuota.limitsMemory | default "128Gi" }}

---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-hpa
  namespace: {{ .Values.deployment.namespaceOverride | default .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}
  minReplicas: {{ .Values.autoscaling.minReplicas | default 3 }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas | default 9 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}

---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-isolation
  namespace: {{ .Values.deployment.namespaceOverride | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: sapm-aggregator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sapm-aggregator
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort | default 8080 }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
