---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}
  namespace: {{ .Values.deployment.namespaceOverride | default "default" }}
  labels:
    app: sapm-aggregator
    version: {{ .Values.global.imageTag }}
spec:
  selector:
    matchLabels:
      app: sapm-aggregator
  template:
    metadata:
      labels:
        app: sapm-aggregator
        version: {{ .Values.global.imageTag }}
{{- with .Values.deployment.labels }}
{{ toYaml . }}
{{- end }}
    spec:
{{- if .Values.replicaCount }}
{{- $affinity := (lookup "v1" "PodAffinity" (index .Release.Namespace "") "").status | default dict }}
      affinity:
{{- with $affinity }}
{{ toYaml . }}
{{- end }}
{{- end }}
      topologySpreadConstraints:
{{- if .Values.deployment.topologySpreadConstraints }}
{{ toYaml .Values.deployment.topologySpreadConstraints | indent 6 }}
{{- end }}
      containers:
      - name: aggregator
        image: "{{ .Values.global.imageRegistry | default "" }}/{{ .Values.aggregator.image.repository }}:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.aggregator.image.pullPolicy }}
        resources:
          limits:
            cpu: {{ .Values.aggregator.resources.limits.cpu }}
            memory: {{ .Values.aggregator.resources.limits.memory }}
          requests:
            cpu: {{ .Values.aggregator.resources.requests.cpu }}
            memory: {{ .Values.aggregator.resources.requests.memory }}
        securityContext:
{{- if .Values.securityContext.privileged }}
          privileged: true
{{- end }}
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
{{- if not .Values.securityContext.readOnlyRootFilesystem }}
          readOnlyRootFilesystem: false
{{- end }}
{{- if .Values.securityContext.allowPrivilegeEscalation }}
          allowPrivilegeEscalation: true
{{- end }}
{{- with .Values.aggregator.xdp }}
{{ if .enabled }}
        volumeMounts:
        - name: hugepages-2Mi
          mountPath: {{ .hugepages.mountPath | default "/dev/hugepages" }}
          readOnly: true
        - name: proc
          mountPath: /proc
          readOnly: true
{{- end }}
{{- end }}
        command:
        - /usr/local/bin/aggregator
        args:
        - "--network-interface={{ .Values.aggregator.xdp.networkInterface | default "eth0,eth1" }}"
        - "--ring-buffer-size={{ .Values.aggregator.xdp.ringBufferSize | default 262144 }}"
{{- if .Values.aggregator.cpuAffinity }}
        - "--cpu-affinity={{ .Values.aggregator.cpuAffinity }}"
{{- end }}
{{- with .Values.aggregator.hugepages }}
{{ if .enabled }}
        - "--hugepages-dir={{ .mountPath | default "/dev/hugepages" }}"
{{- end }}
{{- end }}
        
        livenessProbe:
{{- with .Values.livenessProbe }}
          exec:
            command:
              - {{ .execCommand | quote }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          timeoutSeconds: {{ .timeoutSeconds }}
{{- end }}
        
        readinessProbe:
{{- with .Values.readinessProbe }}
          exec:
            command:
              - {{ .execCommand | quote }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
{{- end }}
          
      volumes:
{{- if .Values.aggregator.hugepages.enabled }}
      - name: hugepages-2Mi
        hostPath:
          path: {{ .Values.aggregator.hugepages.mountPath | default "/dev/hugepages" }}
          type: DirectoryOrCreate
{{- end }}
          
      - name: proc
        hostPath:
          path: /proc
          type: Directory
            
      - name: xdp-config
        configMap:
          name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-xdp-config
          defaultMode: 0644

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-xdp-config
  namespace: {{ .Values.deployment.namespaceOverride | default "default" }}
data:
{{- if .Values.aggregator.xdp.enabled }}
  xdp-program.conf: |
    interface={{ .Values.aggregator.xdp.networkInterface | default "eth0,eth1" }}
    ring-buffer-size={{ .Values.aggregator.xdp.ringBufferSize | default 262144 }}
    packet-max-size=9516
    xdp-action=pass
{{- end }}
  sysctl-optimizations.conf: |
    vm.nr_hugepages={{ .Values.sysctlOptimizations.vmNrHugepages | default 32768 }}
    vm.max_map_count={{ .Values.sysctlOptimizations.vmMaxMapCount | default 262144 }}
    net.core.rmem_max={{ .Values.sysctlOptimizations.netCoreRmemMax | default 67108864 }}
    net.core.wmem_max={{ .Values.sysctlOptimizations.netCoreWmemMax | default 67108864 }}
    net.ipv4.tcp_rmem={{ .Values.sysctlOptimizations.netIpv4TcpRmem | default "4096 87380 67108864" }}
    net.ipv4.tcp_wmem={{ .Values.sysctlOptimizations.netIpv4TcpWmem | default "4096 65536 67108864" }}
    net.core.bpf_jit_enable={{ .Values.sysctlOptimizations.netCoreBpfJitEnable | default 1 }}

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-quota
  namespace: {{ .Values.deployment.namespaceOverride | default "default" }}
spec:
  hard:
    requests.cpu: {{ .Values.resourceQuota.requestsCpu | default "32" }}
    requests.memory: {{ .Values.resourceQuota.requestsMemory | default "64Gi" }}
    limits.cpu: {{ .Values.resourceQuota.limitsCpu | default "64" }}
    limits.memory: {{ .Values.resourceQuota.limitsMemory | default "128Gi" }}

---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-hpa
  namespace: {{ .Values.deployment.namespaceOverride | default "default" }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}
  minReplicas: {{ .Values.autoscaling.minReplicas | default 3 }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas | default 9 }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}

---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.deployment.nameOverride | default "sapm-aggregator" }}-isolation
  namespace: {{ .Values.deployment.namespaceOverride | default "default" }}
spec:
  podSelector:
    matchLabels:
      app: sapm-aggregator
  policyTypes:
  - Ingress
  - Egress
  ingress:
{{- with .Values.networkPolicy.ingressRules }}
{{ toYaml . | indent 2 }}
{{- end }}
  
  egress:
{{- with .Values.networkPolicy.egressRules }}
{{ toYaml . | indent 2 }}
{{- end }}
{{- end }}
