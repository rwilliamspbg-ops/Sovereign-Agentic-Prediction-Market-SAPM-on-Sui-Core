---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sapm-aggregator
  namespace: default
  labels:
    app: sapm-aggregator
    version: v1.0.0
spec:
  selector:
    matchLabels:
      app: sapm-aggregator
  template:
    metadata:
      labels:
        app: sapm-aggregator
        version: v1.0.0
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - $(NODE_NAME)
            
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sapm-aggregator

      containers:
      - name: aggregator
        image: sovereign-mohawk/proto-aggregator:v1.0.0
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "8"
            memory: "16Gi"
          requests:
            cpu: "4"
            memory: "8Gi"
        securityContext:
          privileged: true
          capabilities:
            add: ["NET_ADMIN", "SYS_ADMIN"]
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: true
        
        volumeMounts:
        - name: hugepages-2Mi
          mountPath: /dev/hugepages
          readOnly: true
        - name: proc
          mountPath: /proc
          readOnly: true
        - name: xdp-config
          mountPath: /etc/sapm/xdp
          readOnly: true
        
        command:
        - /usr/local/bin/aggregator
        args:
        - "--network-interface=eth0,eth1,eth2"
        - "--ring-buffer-size=262144"
        - "--cpu-affinity=0-7,16-23,32-39"
        - "--hugepages-dir=/dev/hugepages"
        - "--xdp-program=/etc/sapm/xdp/xdp_prog.ko"
        
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/xdp-status-checker
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/aggregator-healthcheck
          initialDelaySeconds: 10
          periodSeconds: 5
          
      volumes:
      - name: hugepages-2Mi
        hostPath:
          path: /dev/hugepages
          type: DirectoryOrCreate
          
      - name: proc
        hostPath:
          path: /proc
          type: Directory
            
      - name: xdp-config
        configMap:
          name: sapm-xdp-config
          defaultMode: 0644

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sapm-xdp-config
  namespace: default
data:
  xdp-program.conf: |
    interface=eth0,eth1,eth2
    ring-buffer-size=262144
    packet-max-size=9516
    xdp-action=pass
    
  sysctl-optimizations.conf: |
    vm.nr_hugepages=32768
    vm.max_map_count=262144
    net.core.rmem_max=67108864
    net.core.wmem_max=67108864
    net.ipv4.tcp_rmem=4096 87380 67108864
    net.ipv4.tcp_wmem=4096 65536 67108864

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sapm-aggregator-quota
  namespace: default
spec:
  hard:
    requests.cpu: "32"
    requests.memory: "64Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sapm-aggregator-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: sapm-aggregator
  minReplicas: 3
  maxReplicas: 9
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sapm-aggregator-isolation
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: sapm-aggregator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: sapm-aggregator
    ports:
    - protocol: TCP
      port: 8080
  
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: go-control-plane
    ports:
    - protocol: TCP
      port: 443
