# Minimal scaffold for a local Sui test-validator + example agent service.
# NOTE: Replace the `image:` values with official Sui images or build steps
# appropriate for your environment. This file is intentionally conservative and
# meant as a starting point for Phase 0 local cluster work.

services:
  sui-local:
    build:
      context: ./sui-local
      dockerfile: Dockerfile
    container_name: sui-local
    entrypoint: ["/bin/sh", "/opt/sui/entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "9000:9000"   # RPC
      - "9001:9001"   # Gateway / metrics (example)
    volumes:
      - sui-data:/var/sui
    environment:
      - RUST_LOG=info
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sS -X POST -H 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"sui_getLatestCheckpointSequenceNumber\",\"params\":[]}' http://localhost:9000 | grep -q '\"result\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  agent-sample:
    build:
      context: ../agents/sample
      dockerfile: Dockerfile
    container_name: agent-sample
    depends_on:
      sui-local:
        condition: service_healthy
      # Ensure aggregator is available (service start) so agent can POST updates
      aggregator:
        condition: service_started
    environment:
      - SUI_RPC=http://sui-local:9000
      - SUI_FAUCET_URL=http://sui-local:9123/v2/gas
      - AGGREGATOR_URL=https://aggregator-proxy
      - AGG_TOKEN=${AGG_TOKEN:-changeme}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    restart: on-failure

  aggregator:
    image: node:20-bullseye
    container_name: sapm-aggregator
    working_dir: /app
    volumes:
      - ../agents/aggregator:/app
      - aggregator_data:/data
      - ../agents/aggregator/certs:/certs:ro
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    # aggregator listens only on internal network; external access via nginx proxy
    environment:
      - PORT=4000
      - AGG_TOKEN=${AGG_TOKEN:-changeme}
      - MODEL_DIR=/data
      - TLS_CERT=/certs/server.crt.pem
      - TLS_KEY=/certs/server.key.pem
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k -fsS https://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  aggregator-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aggregator-proxy
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - aggregator
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../agents/aggregator/certs:/certs:ro
      - nginx_webroot:/var/www/certbot
      - nginx_certs:/etc/letsencrypt
    environment:
      - HOST_DOMAIN=${PROXY_DOMAIN:-aggregator}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sapm-frontend
    depends_on:
      - aggregator-proxy
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost
      - NEXT_PUBLIC_SUI_RPC=${SUI_RPC:-http://localhost:9000}
    restart: unless-stopped

volumes:
  sui-data:
    name: sui_local_data
  aggregator_data:
    name: sapm_aggregator_data
  nginx_webroot:
    name: sapm_nginx_webroot
  nginx_certs:
    name: sapm_nginx_certs
