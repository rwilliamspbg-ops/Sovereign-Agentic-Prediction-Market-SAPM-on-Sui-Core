server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect all other HTTP to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/__HOST_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__HOST_DOMAIN__/privkey.pem;

  # Fallback served certs copied into letsencrypt path by entrypoint if LE certs missing

  location / {
    proxy_pass http://aggregator:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
