name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-policy:
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.GOVERNANCE_POLICY_GATING != 'true' }}
    env:
      GOVERNANCE_POLICY_GATING: ${{ vars.GOVERNANCE_POLICY_GATING || 'false' }}
      GOVERNANCE_BRANCH: ${{ vars.GOVERNANCE_BRANCH || 'main' }}
      MIN_REQUIRED_STATUS_CHECKS: ${{ vars.MIN_REQUIRED_STATUS_CHECKS || '3' }}
      REQUIRED_STATUS_CHECKS: ${{ vars.REQUIRED_STATUS_CHECKS || 'release-check,frontend-prod-gate,orchestrator-tests,resilience-tests' }}
      GOVERNANCE_POLICY_REPORT_PATH: artifacts/ci-logs/governance-policy-check.json
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate GitHub governance policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/ci-logs
          GOVERNANCE_POLICY_GATING_MODE="${{ vars.GOVERNANCE_POLICY_GATING == 'true' && 'enforced' || 'warn-only' }}" \
            node scripts/check_github_governance_policy.js
      - name: Upload governance policy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-policy-check
          path: artifacts/ci-logs/governance-policy-check.json
          if-no-files-found: warn

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for private keys and secrets
        run: |
          chmod +x scripts/scan_secrets.sh
          scripts/scan_secrets.sh .

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.DEPENDENCY_AUDIT_GATING != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm ci --no-fund
      - name: Audit root dependencies (critical/high)
        run: npm audit --audit-level=high --no-fund
      - name: Audit orchestrator dependencies
        run: npm --prefix agents/orchestrator audit --audit-level=high --no-fund
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high --no-fund

  release-check:
    runs-on: ubuntu-latest
    env:
      FRONTEND_BUILD_TIMEOUT_SECONDS: '900'
      NEXT_TELEMETRY_DISABLED: '1'
      SKIP_FRONTEND_GATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Run canonical release gate
        run: |
          mkdir -p artifacts/ci-logs
          npm run release:check 2>&1 | tee artifacts/ci-logs/release-check.log
      - name: Upload release gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-logs
          path: artifacts/ci-logs/release-check.log
          if-no-files-found: warn

  frontend-prod-gate:
    runs-on: ubuntu-latest
    env:
      FRONTEND_BUILD_TIMEOUT_SECONDS: '900'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install monorepo dependencies
        run: npm run install:all
      - name: Run frontend production gate
        run: |
          mkdir -p artifacts/ci-logs
          npm run check:frontend:prod 2>&1 | tee artifacts/ci-logs/frontend-prod-gate.log
      - name: Upload frontend production gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-prod-gate-logs
          path: artifacts/ci-logs/frontend-prod-gate.log
          if-no-files-found: warn

  orchestrator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/orchestrator/package-lock.json
      - name: Install orchestrator dependencies
        run: npm --prefix agents/orchestrator ci --no-audit --no-fund
      - name: Run orchestrator test suite
        run: npm --prefix agents/orchestrator test
      - name: Enforce orchestrator test coverage floor
        run: |
          chmod +x scripts/check_test_coverage_floor.sh
          COVERAGE_MIN_TESTS=${{ vars.ORCH_COVERAGE_MIN_TESTS || '145' }} scripts/check_test_coverage_floor.sh
      - name: Run orchestrator hardening checks
        run: bash scripts/orchestrator_hardening_check.sh

  reasoner-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Run reasoner smoke checks
        run: npm run test:reasoner-smoke

  deployment-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1
      - name: Helm template validation
        run: |
          helm lint --strict production-deployment-manifests/helm/sapm-aggregator
          helm template sapm-aggregator production-deployment-manifests/helm/sapm-aggregator > /tmp/sapm-aggregator-rendered.yaml


  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Run logger unit tests
        run: node --test agents/lib/logger.test.js
      - name: Run DeepBook bridge unit tests
        run: node --test market-data/adapters/prediction-market-deepbook-bridge.test.js

  move-api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block deprecated Sui Move timestamp API usage
        run: |
          if rg -n "tx_context::epoch_timestamp\(" agents/onchain-registry/sources/*.move; then
            echo "Deprecated API found: use tx_context::epoch_timestamp_ms(ctx) instead."
            exit 1
          fi
          echo "Move timestamp API lint passed."

  resilience-tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.RESILIENCE_GATING != 'true' }}
    env:
      REQUESTS: '120'
      CONCURRENCY: '12'
      SOAK_ITERATIONS: ${{ vars.SOAK_ITERATIONS || '5' }}
      SOAK_REQUESTS: ${{ vars.SOAK_REQUESTS || '100' }}
      SOAK_CONCURRENCY: ${{ vars.SOAK_CONCURRENCY || '10' }}
      CHAOS_REPORT_PATH: artifacts/ci-logs/chaos-report.json
      LOAD_REPORT_PATH: artifacts/ci-logs/load-report.json
      SOAK_REPORT_PATH: artifacts/ci-logs/soak-report.json
      RESILIENCE_POLICY_GATING: ${{ vars.RESILIENCE_POLICY_GATING || 'false' }}
      MIN_CHAOS_SCENARIO_COUNT: ${{ vars.MIN_CHAOS_SCENARIO_COUNT || '3' }}
      MIN_LOAD_SUCCESS_RATE: ${{ vars.MIN_LOAD_SUCCESS_RATE || '95' }}
      MAX_LOAD_P99_LATENCY_MS: ${{ vars.MAX_LOAD_P99_LATENCY_MS || '1000' }}
      MIN_LOAD_REQUESTS: ${{ vars.MIN_LOAD_REQUESTS || '100' }}
      MIN_LOAD_RPS: ${{ vars.MIN_LOAD_RPS || '50' }}
      MIN_SOAK_ITERATIONS: ${{ vars.MIN_SOAK_ITERATIONS || '3' }}
      MIN_SOAK_SUCCESS_RATE: ${{ vars.MIN_SOAK_SUCCESS_RATE || '95' }}
      MAX_SOAK_P99_LATENCY_MS: ${{ vars.MAX_SOAK_P99_LATENCY_MS || '1000' }}
      MIN_SOAK_RPS: ${{ vars.MIN_SOAK_RPS || '50' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Run chaos scenarios
        run: |
          mkdir -p artifacts/ci-logs
          npm run test:chaos 2>&1 | tee artifacts/ci-logs/chaos-tests.log
      - name: Run load benchmark
        run: |
          mkdir -p artifacts/ci-logs
          npm run test:load 2>&1 | tee artifacts/ci-logs/load-tests.log
      - name: Run soak benchmark
        run: |
          mkdir -p artifacts/ci-logs
          node scripts/soak_test_trading.js 2>&1 | tee artifacts/ci-logs/soak-tests.log
      - name: Synthesize resilience summary
        run: |
          mkdir -p artifacts/ci-logs
          node scripts/summarize_resilience_reports.js
      - name: Evaluate resilience policy thresholds
        run: |
          mkdir -p artifacts/ci-logs
          RESILIENCE_POLICY_GATING_MODE="${{ vars.RESILIENCE_POLICY_GATING == 'true' && 'enforced' || 'warn-only' }}" \
            node scripts/check_resilience_policy.js
      - name: Upload resilience logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-test-logs
          path: |
            artifacts/ci-logs/chaos-tests.log
            artifacts/ci-logs/load-tests.log
            artifacts/ci-logs/chaos-report.json
            artifacts/ci-logs/load-report.json
            artifacts/ci-logs/soak-tests.log
            artifacts/ci-logs/soak-report.json
            artifacts/ci-logs/resilience-summary.json
            artifacts/ci-logs/resilience-policy-check.json
          if-no-files-found: warn

  critical-path-summary:
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.FLAKE_GATING != 'true' }}
    env:
      FLAKE_RATE_MAX: ${{ vars.FLAKE_RATE_MAX || '0.0500' }}
      FLAKE_PROBE_RUNS: ${{ vars.FLAKE_PROBE_RUNS || '3' }}
      SAPM_HYBRID_KEX_RESTART_BUDGET_MAX: ${{ vars.SAPM_HYBRID_KEX_RESTART_BUDGET_MAX || '3' }}
      SAPM_HYBRID_KEX_RESTART_BUDGET_WINDOW_MS: ${{ vars.SAPM_HYBRID_KEX_RESTART_BUDGET_WINDOW_MS || '60000' }}
      SAPM_HYBRID_KEX_MAX_RETRIES: ${{ vars.SAPM_HYBRID_KEX_MAX_RETRIES || '1' }}
      SAPM_HYBRID_KEX_RETRY_BACKOFF_MS: ${{ vars.SAPM_HYBRID_KEX_RETRY_BACKOFF_MS || '50' }}
      RESILIENCE_POLICY_GATING: ${{ vars.RESILIENCE_POLICY_GATING || 'false' }}
      LIFECYCLE_POLICY_GATING: ${{ vars.LIFECYCLE_POLICY_GATING || 'false' }}
      LIFECYCLE_MIN_RESTART_BUDGET_MAX: ${{ vars.LIFECYCLE_MIN_RESTART_BUDGET_MAX || '1' }}
      LIFECYCLE_MAX_RESTART_BUDGET_MAX: ${{ vars.LIFECYCLE_MAX_RESTART_BUDGET_MAX || '10' }}
      LIFECYCLE_MIN_RESTART_WINDOW_MS: ${{ vars.LIFECYCLE_MIN_RESTART_WINDOW_MS || '1000' }}
      LIFECYCLE_MAX_RESTART_WINDOW_MS: ${{ vars.LIFECYCLE_MAX_RESTART_WINDOW_MS || '300000' }}
      LIFECYCLE_MIN_RETRIES: ${{ vars.LIFECYCLE_MIN_RETRIES || '0' }}
      LIFECYCLE_MAX_RETRIES: ${{ vars.LIFECYCLE_MAX_RETRIES || '5' }}
      LIFECYCLE_MIN_RETRY_BACKOFF_MS: ${{ vars.LIFECYCLE_MIN_RETRY_BACKOFF_MS || '0' }}
      LIFECYCLE_MAX_RETRY_BACKOFF_MS: ${{ vars.LIFECYCLE_MAX_RETRY_BACKOFF_MS || '1000' }}
    needs:
      - governance-policy
      - release-check
      - frontend-prod-gate
      - unit-tests
      - orchestrator-tests
      - resilience-tests
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/orchestrator/package-lock.json
      - name: Install orchestrator dependencies
        run: npm --prefix agents/orchestrator ci --no-audit --no-fund
      - name: Compute orchestrator flake-rate probe
        run: |
          chmod +x scripts/compute_test_flake_rate.sh
          scripts/compute_test_flake_rate.sh
      - name: Synthesize resilience summary
        run: |
          mkdir -p artifacts/ci-logs
          node scripts/summarize_resilience_reports.js
      - name: Synthesize orchestrator lifecycle summary
        run: |
          mkdir -p artifacts/ci-logs
          FLAKE_GATING_MODE="${{ vars.FLAKE_GATING == 'true' && 'enforced' || 'warn-only' }}" \
            node scripts/summarize_orchestrator_lifecycle.js
      - name: Evaluate lifecycle policy thresholds
        run: |
          mkdir -p artifacts/ci-logs
          EXPECTED_LIFECYCLE_PREFLIGHT_GATE="enabled" \
          EXPECTED_LIFECYCLE_RESTART_ENFORCED="true" \
          LIFECYCLE_POLICY_GATING_MODE="${{ vars.LIFECYCLE_POLICY_GATING == 'true' && 'enforced' || 'warn-only' }}" \
            node scripts/check_orchestrator_lifecycle_policy.js
      - name: Enforce flake-rate threshold
        run: |
          if [[ ! -f artifacts/ci-logs/flake-rate.json ]]; then
            echo "Missing flake-rate report at artifacts/ci-logs/flake-rate.json"
            exit 1
          fi

          ACTUAL=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/flake-rate.json','utf8'));process.stdout.write(String(j.flakeRate));")
          MAX_ALLOWED="${FLAKE_RATE_MAX}"

          if ! node -e "const actual=Number(process.argv[1]);const max=Number(process.argv[2]); if (!Number.isFinite(actual) || !Number.isFinite(max)) { process.exit(2); } process.exit(actual <= max ? 0 : 1);" "$ACTUAL" "$MAX_ALLOWED"; then
            STATUS=$?
            if [[ "$STATUS" -eq 2 ]]; then
              echo "Invalid flake threshold values: actual=${ACTUAL}, max=${MAX_ALLOWED}"
              exit 1
            fi

            echo "Flake threshold exceeded: actual=${ACTUAL} max=${MAX_ALLOWED}"
            exit 1
          fi

          echo "Flake threshold check passed: actual=${ACTUAL} max=${MAX_ALLOWED}"
      - name: Generate critical-path status summary
        run: |
          mkdir -p artifacts/ci-logs
          FLAKE_RATE="n/a"
          FLAKE_RUNS="n/a"
          FLAKE_FAILURES="n/a"
          FLAKE_THRESHOLD="${FLAKE_RATE_MAX}"
          FLAKE_GATING_MODE="${{ vars.FLAKE_GATING == 'true' && 'enforced' || 'warn-only' }}"
          CHAOS_PASSED="n/a"
          CHAOS_SCENARIOS="n/a"
          CHAOS_FAILED="n/a"
          LOAD_SUCCESS_RATE="n/a"
          LOAD_RPS="n/a"
          LOAD_P99="n/a"
          GOV_POLICY_MODE="${{ vars.GOVERNANCE_POLICY_GATING == 'true' && 'enforced' || 'warn-only' }}"
          GOV_POLICY_PASS="n/a"
          GOV_BRANCH_PROTECTED="n/a"
          GOV_SIGNED_COMMITS="n/a"
          GOV_REQUIRED_CHECKS="n/a"
          SOAK_PASSED="n/a"
          SOAK_ITERATIONS="n/a"
          SOAK_SUCCESS_RATE="n/a"
          SOAK_RPS="n/a"
          SOAK_WORST_P99="n/a"
          LIFECYCLE_PREFLIGHT="n/a"
          LIFECYCLE_RESTART_ENFORCED="n/a"
          LIFECYCLE_RESTART_BUDGET_MAX="n/a"
          LIFECYCLE_RESTART_WINDOW_MS="n/a"
          LIFECYCLE_MAX_RETRIES="n/a"
          LIFECYCLE_RETRY_BACKOFF_MS="n/a"
          RESILIENCE_POLICY_MODE="${{ vars.RESILIENCE_POLICY_GATING == 'true' && 'enforced' || 'warn-only' }}"
          RESILIENCE_POLICY_PASS="n/a"
          LIFECYCLE_POLICY_MODE="${{ vars.LIFECYCLE_POLICY_GATING == 'true' && 'enforced' || 'warn-only' }}"
          LIFECYCLE_POLICY_PASS="n/a"
          if [[ -f artifacts/ci-logs/flake-rate.json ]]; then
            FLAKE_RATE=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/flake-rate.json','utf8'));process.stdout.write(String(j.flakeRate));")
            FLAKE_RUNS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/flake-rate.json','utf8'));process.stdout.write(String(j.probeRuns));")
            FLAKE_FAILURES=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/flake-rate.json','utf8'));process.stdout.write(String(j.failures));")
          fi
          if [[ -f artifacts/ci-logs/resilience-summary.json ]]; then
            CHAOS_PASSED=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.chaos.passed));")
            CHAOS_SCENARIOS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.chaos.totalScenarios));")
            CHAOS_FAILED=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(j.chaos.failedScenarios.length ? j.chaos.failedScenarios.join('; ') : 'none');")
            LOAD_SUCCESS_RATE=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.load.successRate));")
            LOAD_RPS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.load.rps));")
            LOAD_P99=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.load.p99LatencyMs));")
            SOAK_PASSED=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.soak.passed));")
            SOAK_ITERATIONS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.soak.iterations));")
            SOAK_SUCCESS_RATE=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.soak.avgSuccessRate));")
            SOAK_RPS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.soak.avgRps));")
            SOAK_WORST_P99=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-summary.json','utf8'));process.stdout.write(String(j.soak.worstP99LatencyMs));")
          fi
          if [[ -f artifacts/ci-logs/resilience-policy-check.json ]]; then
            RESILIENCE_POLICY_MODE=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-policy-check.json','utf8'));process.stdout.write(String(j.mode));")
            RESILIENCE_POLICY_PASS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/resilience-policy-check.json','utf8'));process.stdout.write(String(j.passed));")
          fi
          if [[ -f artifacts/ci-logs/governance-policy-check.json ]]; then
            GOV_POLICY_MODE=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/governance-policy-check.json','utf8'));process.stdout.write(String(j.mode));")
            GOV_POLICY_PASS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/governance-policy-check.json','utf8'));process.stdout.write(String(j.passed));")
            GOV_BRANCH_PROTECTED=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/governance-policy-check.json','utf8'));const c=j.checks.find(x=>x.name==='branchProtectionEnabled');process.stdout.write(String(c?c.actual:'n/a'));")
            GOV_SIGNED_COMMITS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/governance-policy-check.json','utf8'));const c=j.checks.find(x=>x.name==='signedCommitsRequired');process.stdout.write(String(c?c.actual:'n/a'));")
            GOV_REQUIRED_CHECKS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/governance-policy-check.json','utf8'));process.stdout.write(String((j.observedChecks||[]).length));")
          fi
          if [[ -f artifacts/ci-logs/orchestrator-lifecycle-summary.json ]]; then
            LIFECYCLE_PREFLIGHT=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-summary.json','utf8'));process.stdout.write(String(j.providerLifecycle.healthPreflightGate));")
            LIFECYCLE_RESTART_ENFORCED=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-summary.json','utf8'));process.stdout.write(String(j.providerLifecycle.restartBudgetEnforced));")
            LIFECYCLE_RESTART_BUDGET_MAX=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-summary.json','utf8'));process.stdout.write(String(j.providerLifecycle.restartBudgetMax));")
            LIFECYCLE_RESTART_WINDOW_MS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-summary.json','utf8'));process.stdout.write(String(j.providerLifecycle.restartBudgetWindowMs));")
            LIFECYCLE_MAX_RETRIES=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-summary.json','utf8'));process.stdout.write(String(j.providerLifecycle.maxRetries));")
            LIFECYCLE_RETRY_BACKOFF_MS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-summary.json','utf8'));process.stdout.write(String(j.providerLifecycle.retryBackoffMs));")
          fi
          if [[ -f artifacts/ci-logs/orchestrator-lifecycle-policy-check.json ]]; then
            LIFECYCLE_POLICY_MODE=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-policy-check.json','utf8'));process.stdout.write(String(j.mode));")
            LIFECYCLE_POLICY_PASS=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('artifacts/ci-logs/orchestrator-lifecycle-policy-check.json','utf8'));process.stdout.write(String(j.passed));")
          fi
          cat > artifacts/ci-logs/critical-path-summary.md <<'EOF'
          # Critical-Path Matrix Status

          Generated by CI workflow: `critical-path-summary`.

          ## Upstream Job Results

          | Job | Result |
          | --- | --- |
          | release-check | ${{ needs.release-check.result }} |
          | frontend-prod-gate | ${{ needs.frontend-prod-gate.result }} |
          | unit-tests | ${{ needs.unit-tests.result }} |
          | orchestrator-tests | ${{ needs.orchestrator-tests.result }} |
          | resilience-tests | ${{ needs.resilience-tests.result }} |
          | governance-policy | ${{ needs.governance-policy.result }} |

          ## Critical-Path Mapping

          | Flow | Primary CI Evidence | Current Status |
          | --- | --- | --- |
          | Market data ingestion and display | frontend-prod-gate | ${{ needs.frontend-prod-gate.result }} |
          | Trader decision pipeline | release-check + orchestrator-tests | ${{ needs.release-check.result }} / ${{ needs.orchestrator-tests.result }} |
