name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    env:
      FRONTEND_BUILD_TIMEOUT_SECONDS: '900'
      NEXT_TELEMETRY_DISABLED: '1'
      SKIP_FRONTEND_GATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Run canonical release gate
        run: |
          mkdir -p artifacts/ci-logs
          npm run release:check 2>&1 | tee artifacts/ci-logs/release-check.log
      - name: Upload release gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-logs
          path: artifacts/ci-logs/release-check.log
          if-no-files-found: warn

  frontend-prod-gate:
    runs-on: ubuntu-latest
    env:
      FRONTEND_BUILD_TIMEOUT_SECONDS: '900'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install monorepo dependencies
        run: npm run install:all
      - name: Run frontend production gate
        run: |
          mkdir -p artifacts/ci-logs
          npm run check:frontend:prod 2>&1 | tee artifacts/ci-logs/frontend-prod-gate.log
      - name: Upload frontend production gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-prod-gate-logs
          path: artifacts/ci-logs/frontend-prod-gate.log
          if-no-files-found: warn

  orchestrator-hardening-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/orchestrator/package-lock.json
      - name: Install orchestrator dependencies
        run: npm --prefix agents/orchestrator ci --no-audit --no-fund
      - name: Run orchestrator hardening checks
        run: bash scripts/orchestrator_hardening_check.sh

  deployment-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1
      - name: Helm template validation
        run: |
          helm lint --strict production-deployment-manifests/helm/sapm-aggregator
          helm template sapm-aggregator production-deployment-manifests/helm/sapm-aggregator > /tmp/sapm-aggregator-rendered.yaml

  move-api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block deprecated Sui Move timestamp API usage
        run: |
          if rg -n "tx_context::epoch_timestamp\(" agents/onchain-registry/sources/*.move; then
            echo "Deprecated API found: use tx_context::epoch_timestamp_ms(ctx) instead."
            exit 1
          fi
          echo "Move timestamp API lint passed."

  resilience-tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.RESILIENCE_GATING != 'true' }}
    env:
      REQUESTS: '120'
      CONCURRENCY: '12'
      CHAOS_REPORT_PATH: artifacts/ci-logs/chaos-report.json
      LOAD_REPORT_PATH: artifacts/ci-logs/load-report.json
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Run chaos scenarios
        run: |
          mkdir -p artifacts/ci-logs
          npm run test:chaos 2>&1 | tee artifacts/ci-logs/chaos-tests.log
      - name: Run load benchmark
        run: |
          mkdir -p artifacts/ci-logs
          npm run test:load 2>&1 | tee artifacts/ci-logs/load-tests.log
      - name: Upload resilience logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-test-logs
          path: |
            artifacts/ci-logs/chaos-tests.log
            artifacts/ci-logs/load-tests.log
            artifacts/ci-logs/chaos-report.json
            artifacts/ci-logs/load-report.json
          if-no-files-found: warn
