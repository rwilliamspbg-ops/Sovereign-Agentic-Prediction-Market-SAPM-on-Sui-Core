name: SAPM CI Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-local-stack:
    name: Validate Local Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and start local stack
        working-directory: docker
        run: |
          docker compose up -d --build
          echo "Local stack built successfully"
      
      - name: Check service health
        working-directory: docker
        run: |
          docker compose ps
          echo "All services running:"
          docker compose ps
      
      - name: Validate aggregator endpoints
        run: |
          for attempt in $(seq 1 30); do
            if curl -k -fsS https://localhost/health; then
              echo "Aggregator health check passed"
              exit 0
            fi

            echo "Waiting for aggregator proxy to become healthy (attempt ${attempt}/30)..."
            sleep 2
          done

          echo "Aggregator health check failed"
          docker compose -f docker/docker-compose.yml ps
          exit 1

  run-phase2-tests:
    name: Run Phase 2 Tests
    runs-on: ubuntu-latest
    needs: validate-local-stack
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd agents/aggregator
          npm install --no-audit --no-fund
          
      - name: Run Phase 2 simulations
        run: |
          ./scripts/phase2_sim.sh
      
      - name: Validate go/no-go gate
        run: |
          ./scripts/phase2_go_nogo.sh

  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies for security scan
        run: |
          cd agents/aggregator
          npm install
      
      - name: Run npm audit
        run: |
          cd agents/aggregator
          npm audit --audit-level=moderate || true
      
      - name: Check for secrets in code
        run: |
          grep -r "password\|secret\|key" --include="*.js" --exclude-dir=node_modules . || true

  formal-contracts-verify:
    name: Formal Contract Verification
    runs-on: ubuntu-latest
    needs: validate-local-stack
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Phase 2 artifacts
        run: |
          echo "Checking Phase 2 formal verification artifacts..."
          if [ -f "artifacts/phase2/phase2_profiles_report.json" ]; then
            node -e "const p=require('./artifacts/phase2/phase2_profiles_report.json'); if(!p.overallPass) process.exit(1)"
            echo "Phase 2 profiles report valid"
          else
            echo "Phase 2 artifacts not yet generated (expected in early development)"
          fi
