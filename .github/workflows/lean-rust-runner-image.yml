name: Lean/Rust Runner Image

on:
  pull_request:
    paths:
      - '.github/docker/lean-rust-bootstrap/**'
      - '.github/workflows/lean-rust-runner-image.yml'
      - 'formal_verification/lean-toolchain'
      - 'scripts/bootstrap_toolchains.sh'
  push:
    branches: [ main ]
    paths:
      - '.github/docker/lean-rust-bootstrap/**'
      - '.github/workflows/lean-rust-runner-image.yml'
      - 'formal_verification/lean-toolchain'
      - 'scripts/bootstrap_toolchains.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/lean-rust-bootstrap/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sapm-lean-rust-bootstrap:latest
            ghcr.io/${{ github.repository_owner }}/sapm-lean-rust-bootstrap:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
