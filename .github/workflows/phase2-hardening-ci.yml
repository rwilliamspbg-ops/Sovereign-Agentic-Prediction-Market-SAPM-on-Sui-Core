name: phase2-hardening-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  phase2-sim-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            agents/aggregator/package-lock.json
            agents/sample/package-lock.json

      - name: Script lint gate
        run: |
          bash -n scripts/phase2_sim.sh
          bash -n scripts/phase2_go_nogo.sh

      - name: Install aggregator dependencies
        run: npm --prefix agents/aggregator ci --no-audit --no-fund

      - name: Install sample agent dependencies
        run: npm --prefix agents/sample ci --no-audit --no-fund

      - name: Run go/no-go gate
        run: ./scripts/phase2_go_nogo.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase2-sim-artifacts
          path: |
            artifacts/phase2/phase2_profiles_report.json
            /tmp/sapm-agg-sim/byzantine_report.json
            /tmp/sapm-agg-security-sim/security_attack_report.json
            /tmp/sapm-agg-identity-sim/identity_attack_report.json
          if-no-files-found: error
